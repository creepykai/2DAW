    <!--Cree un script que defina un objeto llamado Producto_alimenticio. Este objeto debe presentar las propiedades código, nombre y precio, además del método imprimeDatos,
    el cual escribe por pantalla los valores de sus propiedades.

    Añade un método para modificar el precio de un producto y otro que permita aplicar un descuento al precio del producto indicado-->

        const Producto_alimenticio = {
            codigo: "",

            imprimeDatos: function(){
                document.write("Código: " + this.codigo + "<br>");
                document.write("Nombre: " + this.nombre + "<br>");
                document.write("Precio: " + this.precio + "<br><br>");
            },

                this.precio = nuevo_preccio;
            },

                this.precio *= (1-(descuento / 100));
            }
        }

        let nuevo_precio = parseFloat(prompt("Introduce el nuevo precio"));
        let descuento = 20;

        const producto1 = Object.create(Producto_alimenticio);
        const producto2 = Object.create(Producto_alimenticio);
        const producto3 = Object.create(Producto_alimenticio);

        producto1.codigo = "1";
        producto1.nombre = "Weikis";
        producto1.precio = "1";

        producto2.codigo = "2";

        producto2.precio = "0.55";

        producto3.codigo = "3";
        producto3.nombre = "Mochis";

    </script>
