<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <!--5.	En una aplicación web, es necesario guardar las configuraciones del usuario en formato JSON. Estas configuraciones 
    incluyen el tema de la interfaz, el idioma preferido y si las notificaciones están habilitadas o no. El objetivo es simular el 
    proceso de almacenar y cargar estas configuraciones, modificarlas y guardar los cambios.-->
    <script>
        const configuraciones = {
            tema: "oscuro",
            idioma: "español",
            notificaciones: true
        };

        const configuracionesJSON = JSON.stringify(configuraciones);
        localStorage.setItem("configuraciones", configuracionesJSON);

        const configuracionesCargadasJSON = localStorage.getItem("configuraciones");
        const configuracionesCargadas = JSON.parse(configuracionesCargadasJSON);

        console.log(configuracionesCargadas);

        configuracionesCargadas.tema = "claro";
        localStorage.setItem("configuraciones", JSON.stringify(configuracionesCargadas));

        const configuracionesCargadas2JSON = localStorage.getItem("configuraciones");
        const configuracionesCargadas2 = JSON.parse(configuracionesCargadas2JSON);

        console.log(configuracionesCargadas2);
    </script>
</body>
</html>
