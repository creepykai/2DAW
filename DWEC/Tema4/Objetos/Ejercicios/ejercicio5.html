<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <!--5.	En una aplicación web, es necesario guardar las configuraciones del usuario en formato JSON. Estas configuraciones 
    incluyen el tema de la interfaz, el idioma preferido y si las notificaciones están habilitadas o no. El objetivo es simular el 
    proceso de almacenar y cargar estas configuraciones, modificarlas y guardar los cambios.-->
    <script>
            let configuraciones = {
                tema: "oscuro",        
                idioma: "es",          
                notificaciones: true   
            };

            console.log("Configuraciones iniciales:", configuraciones);


            // Convertir objeto a JSON 
            let jsonConfig = JSON.stringify(configuraciones);
            console.log("Guardado en JSON:", jsonConfig);

            // Cargar desde almacenamiento
            let cargado = JSON.parse(jsonConfig);
            console.log("Configuraciones cargadas:", cargado);

            // Cambiar tema e idioma
            cargado.tema = "claro";
            cargado.idioma = "en";
            cargado.notificaciones = false;

            console.log("Configuraciones modificadas:", cargado);

            // Guardar cambios en JSON
            jsonConfig = JSON.stringify(cargado);
            console.log("JSON actualizado:", jsonConfig);
    </script>
</body>
</html>
