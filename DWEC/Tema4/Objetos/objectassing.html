<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pruebas - objetos</title>
    </head>
    <body>
        <script>
            //Ejemplo de crear objeto con Object.assign()
            //Explicacion: Se crea un objeto base con las propiedades que se van a repetir en todos los objetos
            //Luego se crean los objetos con Object.assign() que heredan las propiedades del objeto base
            //Y se le añaden las propiedades que son diferentes
            //

            const productoBase = {
                codigo: 0,
                nombre: "",
                precio: 0,
                stock: 0,  
            }

            const producto1 = Object.assign({}, productoBase, {
                codigo: 101,
                nombre: "Manzana",
                precio: 1.5,
                stock: 10
            });

            const producto2 = Object.assign({}, productoBase, {
                codigo: 102,
                nombre: "Plátano",
                precio: 2,
                stock: 5
            });



            console.log(producto1);
            console.log(producto2);
            
        </script>
    </body>
</html>
