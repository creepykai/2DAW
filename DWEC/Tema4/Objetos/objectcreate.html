<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pruebas - objetos</title>
    </head>
    <body>
        <script>
            // Ejemplo de crear objeto con Object.create()
            // Explicacion: Se crea un objeto base con las propiedades que se van a repetir en todos los objetos
            // Luego se crean los objetos con Object.create() que heredan las propiedades del objeto base
            // Y se le añaden las propiedades que son diferentes
            
            const productoBase = {
                codigo: 0,
                nombre: "",
                precio: 0,
                stock: 0,
            }

            const producto1 = Object.create(productoBase);
            producto1.codigo = 101;
            producto1.nombre = "Manzana";
            producto1.precio = 1.5;
            producto1.stock = 10;

            const producto2 = Object.create(productoBase);
            producto2.codigo = 102;
            producto2.nombre = "Plátano";
            producto2.precio = 2;
            producto2.stock = 5;

            console.log(producto1);
            console.log(producto2);
        </script>
    </body>
</html>
