            // Ejercicio
            let personas = [
                {nombre: "Juan", ciudad: "Madrid", edad: 25},
                {nombre: "María", ciudad: "Barcelona", edad: 30},
                {nombre: "Pedro", ciudad: "Sevilla", edad: 22},
                {nombre: "Ana", ciudad: "Madrid", edad: 28},
                {nombre: "Luis", ciudad: "Bilbao", edad: 35},
            ];
            console.log(personas);
            
            // Añadir un nuevo elemento
            personas.push({nombre: "Laura", ciudad: "Zaragoza", edad: 29});
            console.log(personas);

            // Funcion para buscar personas por ciudad
            function buscarPorCiudad(personas, ciudad) {
                return personas.filter((persona) => persona.ciudad == ciudad);
            }
            console.log(buscarPorCiudad(personas, "Madrid"));

            // Media de edad de las personas
            function mediaEdad(personas) {
                return personas.reduce((acumulador, persona) => acumulador + persona.edad, 0) / personas.length;
            }
            console.log(mediaEdad(personas));
            
            // Edad máxima
            function edadMaxima(personas) {
                return personas.reduce((acumulador, persona) => persona.edad > acumulador ? persona.edad : acumulador, 0)
            }
            console.log(edadMaxima(personas));
