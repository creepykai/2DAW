<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pruebas - arrays</title>
    </head>
    <body>
        <script>
            // Declarar un array
            const letras0 = new Array(3);
            const letras1 = new Array("a", "b", "c");
            const letras = ["a", "b", "c"];


            // Recorrido de un array
            for (let i = 0; i < letras.length; i++) {
                document.write(`La posición ${i} está la letra ${letras[i]} <br />`);
            }
            document.write("<br />");
            
            for (let i in letras) {
                document.write(`La posición ${i} está la letra ${letras[i]} <br />`);
            }
            document.write("<br />");
            
            for (let letra of letras) {
                document.write(`En la posición está la letra ${letra} <br />`);
            }
            document.write("<br />");

            letras.forEach((letra, posicion) => {
                document.write(`En la posición ${posicion} está la letra ${letra} <br />`);
            });
            document.write("<br />");


            // Spread operator
            console.log(letras);
            console.log(...letras);


            // let copia = letras;  // Referencia
            let copia = [...letras];  // Copia
            let copia2 = [...letras, "d"];  // Copia + elemento nuevo
            let copia3 = [...letras, ...copia, ...copia2];  // concatenar arrays
            copia[1] = "z";
            
            for (let letra of letras) {
                document.write(`En la posición está la letra ${letra} <br />`);
            }
            document.write("<br />");
            
            for (let letra of copia) {
                document.write(`En la posición está la letra ${letra} <br />`);
            }
            document.write("<br />");
            
            for (let letra of copia2) {
                document.write(`En la posición está la letra ${letra} <br />`);
            }
            document.write("<br />");
            
            for (let letra of copia3) {
                document.write(`En la posición está la letra ${letra} <br />`);
            }
            document.write("<br />");


            // Verificar si es un array
            console.log(Array.isArray(letras)); // true
            letras.forEach(letra => console.log(letra));  // forEach
            
            let numeros = [1, 2, 3, 4];
            console.log("Array de números: " + numeros);

            let copiaNum = numeros.map(num => num * num);
            console.log("Array de números duplicados: " + copiaNum);

            let copiaNumM = numeros.filter(num => num > 2);
            console.log("Array de números mayores de 2: " + copiaNumM);
            
            let almenosunoPar = numeros.some(num => num % 2 == 0);
            console.log("Array de números pares: " + almenosunoPar);
            
            let todosPar = numeros.every(num => num % 2 == 0);
            console.log("Array de todos los números pares: " + todosPar);

            let suma = numeros.reduce((acc, num) => acc + num, 0);
            console.log("Todos los valores suman: " + suma);

            console.log("El valor incluye el 3?: " + numeros.includes(3));

            let findMay2 = numeros.find(num => num > 2);
            console.log("Elemento encontrado: " + findMay2);

            let findIndexMay2 = numeros.findIndex(num => num > 2);
            console.log("Indice encontrado: " + findIndexMay2);

            let arrayFrom = Array.from("abcdef");
            console.log(arrayFrom);

            let arrayConcat = numeros.concat(arrayFrom);
            console.log(arrayConcat);

            let numerosAlReves = numeros.reverse();
            console.log(numerosAlReves);

            let numerosEntries = numeros.entries();
            console.log(numerosEntries);
            for (let entry of numerosEntries) {
                console.log(entry);
            }

            let letrasJoin = letras.join("-");
            console.log(letrasJoin);
            
            let letrasString = letras.toString();
            console.log(letrasString);
            
            // let letrasFill = letras.fill("z", 1, 5);
            // console.log(letrasFill);
            
            console.log(letras.indexOf("c"));

            let primero = letras.shift();
            console.log(letras);
            
            primero = letras.unshift();
            console.log(letras);
            
            letras.pop();
            console.log(letras);
            letras.push("z", "f", "i");
            console.log(letras);

            
            const letras2 = ["a", "x", "c", "d", "ñ"];
            letras.sort();
            console.log(letras);
            
            letras2.sort((a, b) => b.localeCompare(a));
            console.log(letras2);

            
            // const numerines = [4, 2, 6, 1, 3];
            // numerines.sort((a, b) => a - b);
            // console.log(numerines);
            // numerines.sort((a, b) => b - a);
            // console.log(numerines);

            
            // const numerines = [4, 2, 6, 1, 3];

            let otro = numerines.slice(1, 3);
            console.log(otro);
            console.log(numerines);

            let otro2 = numerines.splice(2, 1);
            console.log(otro2);
            console.log(numerines);
            
            
        </script>
    </body>
</html>
