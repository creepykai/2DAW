    <!--1.	Crea una función por expresión que devuelva como grados Celsius la cantidad en grados Fahrenheit que recibe como parámetro.-->
    <script>
        fahrenheit = parseFloat(prompt("Introduce los grados en fahrenheits"));
        const cambiogrados = function(fahrenheit){
            celsius = ((fahrenheit - 32) * 5) / 9;
            return celsius;
        }
        console.log(cambiogrados)
    
    </script>
