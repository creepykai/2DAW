<body>
    <!--2.	Escribe una función flecha que indique si un número que recibe como parámetro es múltiplo de 10.-->
    <script>
       let num = parseInt(prompt("Escribe un número"));
        const multiplo = (num) => {
            let esmultiplo = false
            if (num % 10 == 0) esmultiplo = true;
            return esmultiplo
        }
    
    </script>
</body>
