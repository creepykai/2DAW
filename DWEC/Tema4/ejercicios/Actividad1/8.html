<body>
    <!--8.	Cadenas invertidas. Crea una función anónima vinculada a una variable llamada invertida que reciba una cadena de texto 
    y la devuelva invertida (transformada de derecha a izquierda)-->
    <script>
        let invertida = (cadena) => {
            let resultado = '';
            for (let index = cadena.lenght - 1 ; index >= 0; index--) {
                resultado += cadena[index];
            }
            console.log(cadena + ' y la cadena invertida es: ' + resultado);
        }
        invertida('olaH');
    </script>
</body>
