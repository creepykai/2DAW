<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <!--9.	Sello temporal. Crea una función autoejecutable que informe por consola de la fecha y la hora a la que se inició la 
    ejecución de la función.-->
    <script>
        (function(){
            let fecha = new Date();
            let dia = fecha.getDate();
            let mes = fecha.getMonth() + 1; 
            let anio = fecha.getFullYear();
            let horas = fecha.getHours();
            let minutos = fecha.getMinutes();
            let segundos = fecha.getSeconds();
            console.log(`La función se inició el ${dia}/${mes}/${anio} a las ${horas}:${minutos}:${segundos}`);
        })
    </script>
</body>
</html>
