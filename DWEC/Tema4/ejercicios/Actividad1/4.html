<body>
    <!--4.	Crea una función autoejecutable que muestre la tabla de multiplicar del número 8.-->
    <script>
        (function(){
            for (let i = 1; i <= 10; i++) {
                console.log(`8 x ${i} = ${8 * i}`);
            }
        })();
    </script>
