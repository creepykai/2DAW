<body>
    <!--2.	Programa una función que dado un array numérico devuelve otro array con los números elevados al cuadrado, por ejemlo: mi_funcion([1, 4, 5]) devolverá [1, 16, 25].-->
    <script>
        function elevarAlCuadrado(array) {
            return array.map(num => num * num);
        }

        const numeros = [1, 4, 5];
        const resultado = elevarAlCuadrado(numeros);
        console.log(resultado); 
        // Salida: [1, 16, 25]
    
    </script>
</body>
