<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <!--1.	Realizar una petición a la API de JSONPlaceholder y mostrar en consola los datos del usuario con id=1 (https://jsonplaceholder.typicode.com/users/1).-->
    <script>
        fetch("https://jsonplaceholder.typicode.com/users/1")
            .then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.log(error));
    </script>
</body>
</html>
