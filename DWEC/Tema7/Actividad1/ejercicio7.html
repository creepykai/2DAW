<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <!--7.	Simula 3 pasos de un proceso, donde cada paso toma 1 segundo y depende del anterior.-->
    <script>
        const paso1 = () => {
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve("Paso 1 completado");
                }, 1000);
            });
        };

        const paso2 = () => {
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve("Paso 2 completado");
                }, 1000);
            });
        };

        const paso3 = () => {
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve("Paso 3 completado");
                }, 1000);
            });
        };

        paso1()
            .then(resultado => {
                console.log(resultado);
                return paso2();
            })
            .then(resultado => {
                console.log(resultado);
                return paso3();
            })
            .then(resultado => {
                console.log(resultado);
            })
            .catch(error => console.log(error));
    </script>
</body>
</html>
