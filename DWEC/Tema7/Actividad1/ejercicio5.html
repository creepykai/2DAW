<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <!--5.	Crea una función dividir(a, b) que devuelva una promesa. Si b es 0, la promesa debe ser rechazada.-->
    <script>
        const dividir = (a, b) => {
            return new Promise((resolve, reject) => {
                if (b === 0) {
                    reject("No se puede dividir por 0");
                } else {
                    resolve(a / b);
                }
            });
        };

        dividir(10, 2)
            .then(resultado => console.log(resultado))
            .catch(error => console.log(error));
    </script>
</body>
</html>
