<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #cajaVerde{
            background-color: greenyellow;
            width: 10px;
            height: 40px;
        }
        #cajaRoja{
            background-color: red;
            width: 10px;
            height: 40px;
        }
    </style>
</head>
<body>
    <!--3.	Juego de teclas. Escribe un programa para simular la velocidad de pulsación de dos teclas. En pantalla aparecerán dos cajas, 
    una verde y otra roja, una debajo de otra. El alto de cada caja será de 40px y el ancho inicial de 10 px cada una. La primera caja 
    incrementará su ancho 5 px cada vez que se pulse la tecla ”a”. La segunda caja hará lo mismo cuando se pulse la tecla “ñ”. El juego 
    termina cuando una de las cajas llega a 500px de ancho. En ese momento deben desactivarse los eventos de ambas teclas y mostrarse un 
    mensaje bajo las cajas que ponga “GANA VERDE” o “GANA ROJO”. Se trata de calcular con qué mano eres capaz de realizar más pulsaciones.-->
    
    <div id="cajaVerde"></div>
    <div id="cajaRoja"></div>
    <div id="ganador"></div>

    <script>
        const cajaVerde = document.querySelector("#cajaVerde");
        const cajaRoja = document.querySelector("#cajaRoja");
        const ganador = document.querySelector("#ganador");

        function jugar(evento){
            if(evento.key == "a"){
                cajaVerde.style.width = parseInt(cajaVerde.style.width) + 5 + "px";
            }
            if(evento.key == "ñ"){
                cajaRoja.style.width = parseInt(cajaRoja.style.width) + 5 + "px";
            }
            if(parseInt(cajaVerde.style.width) >= 500){
                ganador.innerHTML = "GANA VERDE";
                document.removeEventListener("keydown", jugar);
            }
            if(parseInt(cajaRoja.style.width) >= 500){
                ganador.innerHTML = "GANA ROJO";
                document.removeEventListener("keydown", jugar);
            }
        }
        document.addEventListener("keydown", jugar);
    </script>
</body>
</html>
