<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <!--2.	Sin menú contextual: Crea un programa que no permita que se abra el menú contextual sobre ningún elemento de la web.-->
    <script>
        function deshabilitarMenu(evento){
            evento.preventDefault();
        }
        document.addEventListener("contextmenu", deshabilitarMenu);
    </script>
</body>
</html>
