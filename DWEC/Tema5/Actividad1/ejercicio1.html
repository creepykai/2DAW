<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <!--1.	Tras la pista del ratón: escribe un programa que permita conocer la posición que ocupa el ratón en la pantalla cada vez que se hace clic.-->
    <script>
        document.addEventListener("click", function(e){
            document.write("X: " + e.clientX + " Y: " + e.clientY + "<br>");
        });
    </script>
</body>
</html>
