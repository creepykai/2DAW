<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <p> Haz click y saldrán las coordenadas del ratón</p>
    <div id="coordenadas"></div>

    <script>
        function recogercoordenadas(evento){
            document.querySelector("#coordenadas").innerHTML = "X: " + evento.clientX + " Y: " + evento.clientY;
        }

        document.addEventListener("click", recogercoordenadas)
    </script>
    

    
</body>
</html>
