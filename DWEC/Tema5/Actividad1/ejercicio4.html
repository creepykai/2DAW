<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>
    <div id="galeria">
        <img src="https://picsum.photos/id/237/100/100" alt="Perro">
        <img src="https://picsum.photos/id/1025/100/100" alt="Pug">
        <img src="https://picsum.photos/id/1020/100/100" alt="Oso">
    </div>
    
    <p>Visor:</p>
    <img id="visor" src="https://via.placeholder.com/400" width="400" height="400" style="border: 2px solid black;">

    <script>
        const galeria = document.querySelector("#galeria");
        const visor = document.querySelector("#visor");

        function hacerGrande(evento){
            // Importante: tagName en MAYÚSCULAS
            if(evento.target.tagName == "IMG"){
                visor.src = evento.target.src;
            }
        }

        galeria.addEventListener("mouseover", hacerGrande);
    </script>
</body>

</html>
