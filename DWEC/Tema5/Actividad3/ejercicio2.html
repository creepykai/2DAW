<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio: Combos en Cadena Dinámicos</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .contenedor { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        select { width: 250px; padding: 5px; }
    </style>
</head>
<body>

    <h2>Selección de Ubicación</h2>

    <div class="contenedor">
        <label for="comboComunidades">Comunidad Autónoma:</label>
        <select id="comboComunidades">
            <option value="">Selecciona una comunidad...</option>
        </select>
    </div>

    <div class="contenedor">
        <label for="comboProvincias">Provincia:</label>
        <select id="comboProvincias" disabled>
            <option value="">Primero selecciona una comunidad...</option>
        </select>
    </div>

    <div class="contenedor">
        <label for="comboLocalidades">Localidad:</label>
        <select id="comboLocalidades" disabled>
            <option value="">Primero selecciona una provincia...</option>
        </select>
    </div>

    <script>
        // 1. DATOS (Arrays de objetos siguiendo la estructura de tu enunciado)
        const comunidades = [
            { nombre: "Madrid", pk: 1 },
            { nombre: "Andalucía", pk: 2 }
        ];

        const provincias = [
            { nombre: "Madrid", pk: 10, comunidad: 1 },
            { nombre: "Sevilla", pk: 11, comunidad: 2 },
            { nombre: "Málaga", pk: 12, comunidad: 2 }
        ];

        const localidades = [
            { nombre: "Getafe", pk: 100, provincia: 10 },
            { nombre: "Sevilla Capital", pk: 101, provincia: 11 },
            { nombre: "Marbella", pk: 102, provincia: 12 }
        ];

        // 2. SELECCIÓN DE ELEMENTOS DEL DOM
        const selCom = document.querySelector("#comboComunidades");
        const selProv = document.querySelector("#comboProvincias");
        const selLoc = document.querySelector("#comboLocalidades");

        // 3. CARGA INICIAL: Rellenar comunidades (Usando forEach como en clase)
        comunidades.forEach(function(comunidad) {
            let opt = document.createElement("option"); // Crear etiqueta <option>
            opt.value = comunidad.pk;                  // Asignar PK al value
            opt.textContent = comunidad.nombre;        // Nombre visible
            selCom.appendChild(opt);                   // Meter en el select
        });

        // 4. EVENTO PARA EL CAMBIO DE COMUNIDAD
        selCom.addEventListener("change", function(e) {
            // Limpiar combos hijos y resetear textos por defecto
            selProv.innerHTML = '<option value="">Selecciona una provincia...</option>';
            selLoc.innerHTML = '<option value="">Selecciona una localidad...</option>';
            selLoc.disabled = true; // Bloquear el tercer combo siempre que cambie el primero

            const valorElegido = e.target.value; // Cogemos el PK de la comunidad

            if (valorElegido !== "") {
                selProv.disabled = false; // Habilitar provincia

                // Filtrar provincias que pertenecen a la comunidad seleccionada
                provincias.forEach(function(provincia) {
                    if (provincia.comunidad == valorElegido) {
                        let opt = document.createElement("option");
                        opt.value = provincia.pk;
                        opt.textContent = provincia.nombre;
                        selProv.appendChild(opt);
                    }
                });
            } else {
                selProv.disabled = true;
            }
        });

        // 5. EVENTO PARA EL CAMBIO DE PROVINCIA
        selProv.addEventListener("change", function(e) {
            selLoc.innerHTML = '<option value="">Selecciona una localidad...</option>';
            const valorElegido = e.target.value;

            if (valorElegido !== "") {
                selLoc.disabled = false; // Habilitar localidad

                // Filtrar localidades que pertenecen a la provincia seleccionada
                localidades.forEach(function(localidad) {
                    if (localidad.provincia == valorElegido) {
                        let opt = document.createElement("option");
                        opt.value = localidad.pk;
                        opt.textContent = localidad.nombre;
                        selLoc.appendChild(opt);
                    }
                });
            } else {
                selLoc.disabled = true;
            }
        });
    </script>
</body>
</html>
