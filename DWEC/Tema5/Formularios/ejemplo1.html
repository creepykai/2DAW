<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 1</title>
    <style>
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background-color: pink;
        }
    </style>
</head>

<body>
    <form action="#"  id="myForm">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">
        <div class="error-message" id="errorName"></div>
        <br>
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" >
        <div class="error-message" id="errorAge"></div>
        <br>
        <label for="contraseña">Contraseña:</label>
        <input type="password" id="contraseña" name="contraseña">
        <div class="error-message" id="errorContraseña"></div>
        <br>
        <input type="submit" id="submit" name="submit" value="Enviar">
    </form>
    <script>
        function validaForm() {
            let isValid = true;

            //Validar el campo nombre
            const nameInput = document.getElementById("nombre");
            const errorName = document.getElementById("errorName");
            if (nameInput.value.trim() === "") {
                errorName.textContent = "El campo nombre es obligatorio";
                isValid = false;
            } else {
                errorName.textContent = "";
            }

            //Validar el campo edad
            const ageInput = document.getElementById("edad");
            const errorAge = document.getElementById("errorAge");
            if (ageInput.value.trim() === "") {
                isValid = false;
                errorAge.textContent = "El campo edad es obligatorio";

            } else if (ageInput.value.trim() < 18 || ageInput.value.trim() > 120) {
                isValid = false;
                errorAge.textContent = "La edad debe estar entre 18 y 120";

            } else {
                errorAge.textContent = "";
            }
            return isValid;
        }

        document.getElementById("myForm").addEventListener("submit", function (event) {
            if (!validaForm()) {
                event.preventDefault();
            }
        })
    </script>


</body>

</html>
