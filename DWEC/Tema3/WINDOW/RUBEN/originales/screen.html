<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo window.screen</title>
</head>
<body>
  <h1>window.screen</h1>
  <p id="info"></p>

  <script>
    // Muestra información de la pantalla del usuario
    const info = document.getElementById('info');
    info.textContent = `Ancho de pantalla: ${window.screen.width}px - Alto de pantalla: ${window.screen.height}px`;
  </script>
</body>
</html>
