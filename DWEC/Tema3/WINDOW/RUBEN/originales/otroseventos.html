<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Otros eventos window</title>
  <style>
    body {
      height: 2000px; /* para poder hacer scroll */
    }
  </style>
</head>
<body>
  <h1>Otros eventos window</h1>
  <p>Haz scroll o cierra la pestaña.</p>

  <script>
    // Evento onscroll:muestra por consola la posicion Y del scroll
    window.onscroll = () => {
      console.log("📜 Se está haciendo scroll. Posición Y:", window.scrollY);
    };

    // Evento onbeforeunload: abre un cuadro de diálogo de confirmación antes de que el usuario abandone la página
    window.onbeforeunload = (event) => {
      event.preventDefault();
      event.returnValue = "¿Estás seguro que quieres salir?";
    };

  </script>
</body>
</html>
