<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Aleatoria</title>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin: 10px;
        }
        
        .clsTarjetaImagen {
            margin: 10px;
            padding: 10px;
            width: 200px;
            border: 3px dotted plum;
            display: inline-block;
            vertical-align: top;
            background-color: #f9f9f9;
        }

        .clsTarjetaImagen img {
            width: 100%;
            display: block;
        }

        #btnAgregar {
            background-color: rgb(166, 99, 228);
            color: white;
            border: none;
            padding: 5px 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        #galeria-container {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h3>Galería de Imágenes Aleatoria</h3>
    <button id="btnAgregar" onclick="agregarImagen()">Agregar Imagen Aleatoria</button>

    <div id="galeria-container"></div>

    <script>
        let galeria = document.getElementById("galeria-container");

        function agregarImagen() {
            
            let tarjeta = document.createElement("div");
            tarjeta.classList.add("clsTarjetaImagen");

            const img = document.createElement("img");
            
            img.src = "https://picsum.photos/200/200?random=" + Math.random();

            tarjeta.appendChild(img);
            
            galeria.appendChild(tarjeta);
        }
    </script>
</body>
</html>
