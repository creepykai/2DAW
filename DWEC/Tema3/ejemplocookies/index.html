<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookies</title>
</head>
<body>
    <!---->
    <h2> Cookies </h2>
    <button onclick="guardarCookie()"> Guardar cookie </button>

    <script>
        function guardarCookie(){
            const mensaje = "Cookie: hola";
            document.cookie = `mensaje = ${mensaje}; 'expires = 01 Jan 2099'`;
        }
    </script>
</body>
</html>
