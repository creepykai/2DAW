<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tarea 2</title>

    <style>
        .caja {
            color: white;
            border: 1px solid white;
            padding: 5px;
            width: 100px;
            display: inline-block;
            text-align: center;
        }

        #cajaazul {
            background-color: blue;
        }

        #cajaverde {
            background-color: green;
        }

        #cajarojo {
            background-color: red;
        }

        #cajanegro {
            background-color: black;
        }
    </style>
</head>
<body>

    <div>
        <div class="caja" id="cajaazul">azul</div>
        <div class="caja" id="cajaverde">verde</div>
    </div>
    <div>
        <div class="caja" id="cajarojo">rojo</div>
        <div class="caja" id="cajanegro">negro</div>
    </div>

</body>
</html>
