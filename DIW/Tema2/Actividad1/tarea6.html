<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formas css básicas</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; }
        .fila {
            display: flex;
            align-items: flex-end;
            gap: 28px;
            padding: 24px;
        }

        .forma { display: inline-block; }

        .forma1 { width: 30px; height: 30px; background: rgb(196,68,68); }

        .forma2 { width: 70px; height: 30px; background: rgb(80,80,80); }

        .forma3 { width: 30px; height: 70px; background: rgb(196,68,68); }

        .forma4 {
            width: 150px;
            height: 40px;
            background: rgb(80,80,80);
            clip-path: polygon(12% 0, 88% 0, 100% 100%, 0 100%);
        }

        .forma5 {
            width: 110px;
            height: 40px;
            background: rgb(196,68,68);
            clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%);
            transform: scaleX(-1);
        }


        .forma6 { width: 36px; height: 36px; background: rgb(80,80,80); border-radius: 50%; }

        .forma7 { width: 100px; height: 50px; background: rgb(196,68,68); border-radius: 50%; }

        .forma8 {
            width: 0; height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 36px solid rgb(80,80,80);
        }

        .forma9 {
            width: 0; height: 0;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-right: 36px solid rgb(196,68,68);
        }
    </style>
</head>
<body>
    <div class="fila">
        <div class="forma forma1"></div>
        <div class="forma forma2"></div>
        <div class="forma forma3"></div>
        <div class="forma forma4"></div>
        <div class="forma forma5"></div>
        <div class="forma forma6"></div>
        <div class="forma forma7"></div>
        <div class="forma forma8"></div>
        <div class="forma forma9"></div>
    </div>
</body>
</html>
