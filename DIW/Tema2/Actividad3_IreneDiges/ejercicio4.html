<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 4 - Estilo Kuromi</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .lista_estilos {
            width: 400px;
            list-style: none;
            padding: 0; 
            border: 3px solid black;
            border-radius: 10px;
            overflow: hidden;
        }

        .lista_estilos li {
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .lista_estilos li:nth-child(odd) {
            background-color: black;
            color: white;
        }

        .lista_estilos li:nth-child(even) {
            background-color: #BC4077;
            color: white;
        }
    </style>
</head>
<body>

    <ul class="lista_estilos">
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3</li>
        <li>Elemento 4</li>
        <li>Elemento 5</li>
        <li>Elemento 6</li>
    </ul>

</body>
</html>
