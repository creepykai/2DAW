<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 3 - Pruebas de font-size</title>
    <style>
        html {
            font-size: 25px;
        }

        body {
            font-family: sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 45px;
            font-family: 'Times New Roman', Times, serif;
        }

        .parrafo_in {
            color: blue;
            font-size: 0.5in;
        }

        .parrafo_px {
            font-size: 25px;
            color: brown;
        }

        .parrafo_em {
            font-size: 2em;
            color: green;
        }

        .parrafo_rem {
            font-size: 1.5rem;
            color: red;
        }

        .contenedor_boton {
            margin-top: 30px;
        }

        .boton_azul {
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            color: white;
            background-color: blue;
            border-radius: 5px;
            font-size: 0.7rem;
            border: none;
        }

    </style>
</head>
<body>

    <h1>Pruebas de font-size</h1>

    <p class="parrafo_in">Este es un párrafo utiliza in.</p>
    
    <p class="parrafo_px">Este es un párrafo utiliza px.</p>

    <p class="parrafo_em">Este es un párrafo utiliza em.</p>

    <p class="parrafo_rem">Este es un párrafo utiliza rem.</p>

    <div class="contenedor_boton">
        <button class="boton_azul">Botón</button>
    </div>
    
</body>
</html>
