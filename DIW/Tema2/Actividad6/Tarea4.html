<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 4 </title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Verdana', 'Arial', sans-serif;
            background-color: #f4f4f4;
        }

        .contenedorGrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 350px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            border: 10px solid white;
        }

        .cajaImagen {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .cajaImagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }


        .cajaTexto {
            background-color: #ffffff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        h3 {
            margin: 0 0 15px 0;
            font-size: 1.4em;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #111;
        }

        p {
            margin: 0 0 25px 0;
            font-size: 0.9em;
            line-height: 1.5;
            color: #666;
        }

        .botonNegro {
            background-color: #000;
            color: #fff;
            text-decoration: none;
            padding: 12px 25px;
            font-size: 0.8em;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background 0.3s;
        }

        .botonNegro:hover {
            background-color: #444;
        }

        .span-castillo {
            grid-column: span 2;
            grid-row: span 2;
        }

        .span-vela {
            grid-column: span 2;
        }

      
    </style>
</head>
<body>

    <div class="contenedorGrid">
        
        <div class="cajaImagen span-castillo">
            <img src="https://picsum.photos/id/1040/800/800" alt="Castillo">
        </div>

        <div class="cajaTexto">
            <h3>Handmade</h3>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.</p>
            <a href="#" class="botonNegro">CHECK OUT</a>
        </div>

        <div class="cajaImagen">
            <img src="https://picsum.photos/id/866/600/600" alt="Nieve">
        </div>
        <div class="cajaImagen">
            <img src="https://picsum.photos/id/28/600/600" alt="Bosque Verde">
        </div>

        <div class="cajaTexto">
            <h3>Handmade</h3>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.</p>
            <a href="#" class="botonNegro">CHECK OUT</a>
        </div>

        <div class="cajaImagen">
            <img src="https://picsum.photos/id/93/600/600" alt="Cañón">
        </div>
        <div class="cajaTexto">
            <h3>Handmade</h3>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.</p>
            <a href="#" class="botonNegro">CHECK OUT</a>
        </div>

        <div class="cajaImagen span-vela">
            <img src="https://picsum.photos/id/214/800/600" alt="Vela Barco">
        </div>

    </div>

</body>
</html>
