<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 7</title>
    
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .encabezado {
            background-color: #ff4500; 
            color: white;
            padding: 20px 0;
            font-weight: bold;
        }

        .contenedor-principal {
            background-color: darkgreen; 
            color: white;
            min-height: 100vh;
            padding-top: 20px;
        }

        .contenedor-principal p {
            margin-top: 0;
            font-size: 1.2em;
        }

        @media screen and (min-width: 600px) and (max-width: 1024px) {
            .encabezado {
                background-color: black;
            }
            
            .contenedor-principal {
                background-color: blue; 
                color: white;
            }
        }

        @media screen and (min-width: 1025px) {
            .encabezado {
                background-color: blue; 
            }
            
            .contenedor-principal {
                background-color: white; 
                color: black;
            }
        }
    </style>
    </head>
<body>
    <header class="encabezado">
        Ejemplo con media query
    </header>
    <div class="contenedor-principal">
        <p>Este es un ejemplo donde el color cambia según el tamaño de la pantalla.</p>
    </div>
</body>
</html>
