<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 6</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px; 
        }

        .cajaFigura {
            width: 200px;
            height: 200px;
            
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
            transition: all 0.5s ease;
            cursor: pointer;
        }
       .caja1 {
            background: linear-gradient(45deg, rgb(245, 127, 137) 25%, rgb(135, 127, 247) 100%);
            color: white;
            font-weight: bold;
            font-size: 1.5em;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.5;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        .caja1:hover {
            opacity: 1;
        }

        .caja2 {
            background: linear-gradient(to bottom right, #006400, #FFD700);
            border-radius: 50%; 
            color: white;
            font-weight: bold;
            font-size: 1.5em; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        .caja2:hover {
            background: linear-gradient(to bottom right, #FFD700, #006400);
        }

        .caja3 {
            background-color: #d3d3d3; 
            color: black; 
            text-shadow: none;
            border: 2px solid black; 
            border-radius: 10px;
        }

        .caja3 {
            background-color: #d3d3d3; 
            color: black; 
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid black; 
            border-radius: 10px;
            transition: box-shadow 0.3s ease;
        }

        .caja3:hover {
            box-shadow: 5px 5px 5px 0px black;
        }

        .caja4:hover {
            background: radial-gradient(circle, #FF4500, #FFFF00);
        }

        .caja4 {
            border-radius: 50%;
            background: radial-gradient(circle, yellow, orange, red);
            color: black;
            font-weight: bold;
            font-size: 1.5em; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        .caja4:hover {
            background: radial-gradient(circle,red, orange, yellow );
        }

      .caja5 {
            width: 200px;
            height: 200px;
            background: repeating-linear-gradient(
                45deg,
                blue 0px,
                blue 5px,
                black 5px,
                black 10px
            );
            color: white;
            font-weight: bold;
            font-size: 1.5em;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .caja5:hover {
            background: repeating-linear-gradient(
                -45deg,
                red 0px,
                red 5px,
                black 5px,
                black 10px
            );
        }

        .caja6 {
            background: repeating-radial-gradient(
                circle,
                black,           
                black 5px,       
                green 5px,       
                green 10px       
            );
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="cajaFigura caja1">Caja 1</div>
    <div class="cajaFigura caja2">Caja 2</div>
    <div class="cajaFigura caja3">Caja 3</div>
    <div class="cajaFigura caja4">Caja 4</div>
    <div class="cajaFigura caja5">Caja 5</div>
    <div class="cajaFigura caja6">Caja 6</div>

</body>
</html>
