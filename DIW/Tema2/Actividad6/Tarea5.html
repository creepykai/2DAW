<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Perfil - Estilo Moderno</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .tarjetaPerfil {
            display: flex;
            flex-direction: row;
            width: 600px;
            height: 320px; 
            background-color: white;
            border-radius: 20px;
            overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
        }

        .ladoIzquierdo {
            flex: 0 0 35%; 
            background-image: url('fondo.jpg'); 
            background-size: cover;
            background-position: center;
        }

        .ladoDerecho {
            flex: 1; 
            padding: 30px 40px 30px 60px; 
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contenedorAvatar {
            position: absolute;
            top: 40px; 
            left: 35%; 
            transform: translateX(-50%); 
            z-index: 10; 
        }
        
        .circuloAvatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 5px solid white;
            background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .etiquetaMountain {
            position: absolute;
            top: 25px;
            right: 30px;
            font-size: 0.75em;
            font-weight: bold;
            color: #4caf50;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h2 {
            margin: 0 0 15px 0;
            color: #242424;
            font-size: 1.8em;
            font-weight: bold;
            line-height: 1.2;
        }

        p {
            font-size: 0.85em;
            line-height: 1.6;
            color: #646464;
            margin: 0 0 25px 0;
        }

        .iconosSociales {
            display: flex;
            gap: 25px;
        }

        .iconosSociales i {
            font-size: 1.2em;
            color: #8bc34a;
            cursor: pointer;
            transition: color 0.3s, transform 0.2s;
        }

        .iconosSociales i:hover {
            color: #4caf50;
            transform: translateY(-2px);
        }

    </style>
</head>
<body>

    <div class="tarjetaPerfil">
        
        <div class="ladoIzquierdo"></div>

        <div class="contenedorAvatar">
            <div class="circuloAvatar"></div>
        </div>

        <div class="ladoDerecho">
            <span class="etiquetaMountain">Mountain</span>
            
            <h2>Irene Diges</h2>
            
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quasi, deleniti modi. Minus quas, esse sapiente earum autem ad in ipsum.</p>
            
            <div class="iconosSociales">
                <i class="fa-regular fa-heart"></i>
                <i class="fa-regular fa-envelope"></i>
                <i class="fa-solid fa-user-group"></i>
            </div>
        </div>

    </div>

</body>
</html>
