<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 5 - object-fit</title>
    <style>
        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        .box {
            width: 100px;
            height: 100px;
            border: 2px solid #525252;
            background-color: #dbdbdb;
        }

        .box img {
            width: 100%;
            height: 100%;
            background-color: white;
        }

        #imagen1 {
            object-fit: fill;
        }

        #imagen2 {
            object-fit: contain;
        }

        #imagen3 {
            object-fit: cover;
        }

        #imagen4 {
            object-fit: none;
        }

        #imagen5 {
            object-fit: scale-down;
        }

    </style>
</head>
<body>
    <div class="container">
        
        <div class="box">
            <img id="imagen1" src="https://picsum.photos/400/200?random=1" alt="Imagen fill">
        </div>
        
        <div class="box">
            <img id="imagen2" src="https://picsum.photos/400/200?random=2" alt="Imagen contain">
        </div>

        <div class="box">
            <img id="imagen3" src="https://picsum.photos/400/200?random=3" alt="Imagen cover">
        </div>

        <div class="box">
            <img id="imagen4" src="https://picsum.photos/400/200?random=4" alt="Imagen none">
        </div>

        <div class="box">
            <img id="imagen5" src="https://picsum.photos/400/200?random=5" alt="Imagen scale-down">
        </div>

    </div>

</body>
</html>
