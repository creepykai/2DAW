<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
            background-color: rgb(240, 240, 240);
        }

        .cabeceraTitulo {
            background-color: rgb(51, 51, 51);
            color: rgb(255, 255, 255);
            padding: 20px 40px;
            margin: 0;
        }

        .cabeceraTitulo h1 {
            margin: 0;
            font-weight: normal;
            font-size: 2.5em;
        }

        .galeriaFlex {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px; 
            background-color: rgb(190, 190, 190);
            padding: 20px; 
            border-bottom: 1px solid rgb(153, 153, 153);
        }

        .cajaImagen {
            flex: 1; 
            min-width: 150px; 
            border: 1px dashed rgb(80, 80, 80);
            padding: 10px;
            background-color: transparent;
        }

        .cajaImagen img {
            display: block;
            width: 100%; 
            height: 200px; 
            object-fit: cover;
        }
    </style>
</head>
<body>

    <header class="cabeceraTitulo">
        <h1>Flexbox: Catálogo de imágenes</h1>
    </header>

    <div class="galeriaFlex">
        
        <div class="cajaImagen">
            <img src="https://picsum.photos/id/10/600/400" alt="Paisaje 1">
        </div>

        <div class="cajaImagen">
            <img src="https://picsum.photos/id/16/600/400" alt="Paisaje 2">
        </div>

        <div class="cajaImagen">
            <img src="https://picsum.photos/id/54/600/400" alt="Edificio">
        </div>

        <div class="cajaImagen">
            <img src="https://picsum.photos/id/58/600/400" alt="Faro">
        </div>

        <div class="cajaImagen">
            <img src="https://picsum.photos/id/101/600/400" alt="Edificio B&N">
        </div>

    </div>

</body>
</html>
