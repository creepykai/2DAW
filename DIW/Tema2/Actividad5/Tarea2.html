
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
        }

        .contenedorPrincipal {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(0, 127, 127);
            padding: 10px 15px;
            font-family: Arial, sans-serif;
        }

        .grupoIzquierdo {
            display: flex;
            gap: 20px;
        }

        .enlaceMenu {
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .grupoDerecho {
            display: flex;
            gap: 5px;
        }

        .campoBusqueda {
            padding: 2px 5px;
            border: none;
            outline: none;
            font-size: 12px;
            color: #666;
        }

        .botonIr {
            background-color: white;
            border: none;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 10px;
            font-weight: bold;
            color: rgb(0, 127, 127);
        }
    </style>
</head>
<body>

    <nav class="contenedorPrincipal">
        <div class="grupoIzquierdo">
            <span class="enlaceMenu">Logo</span>
            <span class="enlaceMenu">Home</span>
            <span class="enlaceMenu">Products</span>
            <span class="enlaceMenu">Services</span>
        </div>

        <div class="grupoDerecho">
            <input type="text" class="campoBusqueda" placeholder="Search">
            <button class="botonIr">Go</button>
        </div>
    </nav>

</body>
</html>
