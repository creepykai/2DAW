<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1</title>
    <style>
        * {
            margin: 0; 
            padding: 0;
            box-sizing: border-box;
        }

        .tituloPrincipal {
            background-color: #333;
            color: white;
            padding: 30px;
            font-size: 40px;
            font-family: serif;
        }

        .menuContainer {
            display: flex;
            justify-content: space-around; 
            align-items: center;           
            background-color: rgb(204, 204, 204);
        }

        .menuItem {
            background-color: rgb(204, 204, 204);
            border: 1px solid white;
            padding: 10px;
            font-size: 10px;
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>

    <div class="tituloPrincipal">
        Flexbox
    </div>

    <nav class="menuContainer">
        <div class="menuItem">Enlace 1</div>
        <div class="menuItem">Enlace 2</div>
        <div class="menuItem">Enlace 3</div>
        <div class="menuItem">Enlace 4</div>
    </nav>

</body>
</html>
