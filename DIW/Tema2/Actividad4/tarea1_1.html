<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1</title>
    <style>
        .contenedor-enlaces {
            display: flex; 
            gap: 5px; 
        }

        .btn {
            background-color: rgb(255, 99, 71); 
            color: rgb(255, 255, 255); 
            padding: 15px 30px; 
            text-decoration: none; 
            font-family: sans-serif;
            font-size: 18px;
            display: inline-block;
        }

        .btn:visited {
            background-color: rgb(165, 42, 42); 
            color: rgb(220, 220, 220); 
        }

        .btn:hover {
            background-color: rgb(255, 140, 0); 
        }
    </style>
</head>
<body>
    <div class="contenedor-enlaces">
        <a href="#ejemplo1" class="btn">Enlace 1</a>
        <a href="#ejemplo2" class="btn">Enlace 2</a>
        <a href="#ejemplo3" class="btn">Enlace 3</a>
    </div>
</body>
</html>
