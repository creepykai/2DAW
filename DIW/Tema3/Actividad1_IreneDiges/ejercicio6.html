<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6 - Efecto Tarjeta Pingüino</title>
    <style>
        body {
            background: #1976D2;
            font-family: sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .contenedor {
            display: flex;
            background: #01579B;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.16), 0 3px 6px rgba(0, 0, 0, 0.23);
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -120px;
            margin-left: -180px;
            width: 360px;
            height: 240px;
        }

        .mitad {
            perspective: 1000px;
            width: 180px;
            height: 240px;
        }

        .contenedor:hover .tarjeta.izquierda {
            transform: rotateY(-180deg);
        }

        .contenedor:hover .tarjeta.derecha {
            transform: rotateY(180deg);
        }

        .tarjeta {
            transition: 0.6s;
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .frente,
        .atras {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .frente {
            z-index: 2;
            background: #2196F3;
            transform: rotateY(0deg);
            overflow: hidden;
        }

        .frente-izquierda .circulo {
            position: absolute;
            right: -50px;
            top: 50%;
            margin-top: -50px;
        }

        .frente-derecha .circulo {
            position: absolute;
            left: -50px;
            top: 50%;
            margin-top: -50px;
        }

        .circulo {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 100%;
            background: #ffffff;
            box-shadow: 0 19px 38px rgba(0, 0, 0, 0.20), 0 15px 12px rgba(0, 0, 0, 0.12);
        }

        .atras {
            background: rgb(220, 220, 220);
            transform: rotateY(180deg);
            overflow: hidden;
        }

        .atras img {
            width: 360px;
            height: 240px;
            position: absolute;
            top: 0;
        }

        .atras-izquierda img {
            left: -180px;
        }

        .atras-derecha img {
            right: 0;
            left: 0;
        }

        .tarjeta.izquierda {
            transform-origin: right center;
        }

        .tarjeta.derecha {
            transform-origin: left center;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="mitad">
            <div class="tarjeta izquierda">
                <div class="frente frente-izquierda">
                    <div class="circulo"></div>
                </div>
                <div class="atras atras-izquierda">
                    <img src="https://images.unsplash.com/photo-1598439210625-5067c578f3f6?w=360&h=240&fit=crop"
                        alt="Pingüino">
                </div>
            </div>
        </div>

        <div class="mitad">
            <div class="tarjeta derecha">
                <div class="frente frente-derecha">
                    <div class="circulo"></div>
                </div>
                <div class="atras atras-derecha">
                    <img src="https://images.unsplash.com/photo-1598439210625-5067c578f3f6?w=360&h=240&fit=crop"
                        alt="Pingüino">
                </div>
            </div>
        </div>

    </div>

</body>

</html>
