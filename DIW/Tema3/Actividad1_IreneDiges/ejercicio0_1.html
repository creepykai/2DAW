<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 0.1</title>
    <style>
        h1 {
            text-align: center;
        }
        .contenedor {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #translate {
            margin: 20px;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            background-color: rgb(125, 125, 202);
            transition: transform 0.5s ease;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #scale {
            margin: 20px;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            background-color: rgb(125, 125, 202);
            transition: transform 0.5s ease;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #rotate {
            margin: 20px;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            background-color: rgb(125, 125, 202);
            transition: transform 0.5s ease;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #translate:hover {
            transform: translate(50px, 50px);
        }
        #scale:hover {
            transform: scale(2);
        }
        #rotate:hover {
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <!--Realiza la siguiente página, donde al hacer hover en cada uno de los rectángulos se aplique la transformación correspondiente.-->
    <h1>Transformaciones CSS al hacer hover</h1>
    <div class="contenedor">
        <div id="translate"> Translate</div>
        <div id="scale"> Scale</div>
        <div id="rotate"> Rotate</div>
    </div>    
</body>
</html>
