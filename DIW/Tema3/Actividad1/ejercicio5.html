<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo 3D Carrusel</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }

        h2 {
            margin-bottom: 50px;
            color: #333;
        }

        .escenario {
            width: 250px;
            height: 250px;
            perspective: 800px;
        }

        .cubo {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotar 12s infinite linear;
        }

        .cara {
            position: absolute;
            width: 250px;
            height: 250px;
            background-color: white;
            border: 2px solid white;
        }

        .cara img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .frontal {
            transform: rotateY(0deg) translateZ(125px);
        }

        .derecha {
            transform: rotateY(90deg) translateZ(125px);
        }

        .trasera {
            transform: rotateY(180deg) translateZ(125px);
        }

        .izquierda {
            transform: rotateY(-90deg) translateZ(125px);
        }

        @keyframes rotar {
            from {
                transform: rotateY(0deg);
            }

            to {
                transform: rotateY(-360deg);
            }
        }
    </style>
</head>

<body>

    <h2>Carrusel de fotos automático</h2>

    <div class="escenario">
        <div class="cubo">
            <div class="cara frontal">
                <img src="https://picsum.photos/id/433/250/250" alt="Natación">
            </div>

            <div class="cara derecha">
                <img src="https://picsum.photos/id/1060/250/250" alt="Esgrima">
            </div>

            <div class="cara trasera">
                <img src="https://picsum.photos/id/338/250/250" alt="Pilates">
            </div>

            <div class="cara izquierda">
                <img src="https://picsum.photos/id/1062/250/250" alt="Karate">
            </div>
        </div>
    </div>

</body>

</html>
